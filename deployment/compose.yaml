name: carecall
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      CARECALL_PUBLIC_ORIGIN: https://${CARECALL_DOMAIN:?Set CARECALL_DOMAIN to a domain you control}
      CARECALL_TEST_CALL_PHONE: ""
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CARECALL_DOMAIN: ${CARECALL_DOMAIN:?Set CARECALL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notifications}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
